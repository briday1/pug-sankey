name: Test and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test JavaScript
        run: |
          node --check src/pug_sankey/web/app.mjs
          node --check src/pug_sankey/web/parser.mjs
          node --check src/pug_sankey/web/pugflow.mjs
          node --test tests/js/*.test.mjs
      - name: Test Python
        run: PYTHONPATH=src python -m unittest discover -s tests/python -v

  pages:
    name: Deploy to GitHub Pages
    needs: [test]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Cache-bust browser assets
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python <<'PYTHON_EOF'
          import os
          import re
          from pathlib import Path

          web = Path("src/pug_sankey/web")
          version = os.environ["ASSET_VERSION"]
          patterns = {
              ".html": re.compile(r'(?P<prefix>(?:href=|import\()["\'])(?P<path>(?:\./)?[^"\'?]+\.(?:css|mjs))'),
              ".mjs": re.compile(r'(?P<prefix>(?:from\s+|import\()["\'])(?P<path>(?:\./)?[^"\'?]+\.mjs)'),
          }
          for path in [*web.glob("*.html"), *web.glob("*.mjs")]:
              source = path.read_text()
              path.write_text(patterns[path.suffix].sub(
                  lambda match: f'{match["prefix"]}{match["path"]}?v={version}',
                  source,
              ))
          PYTHON_EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/pug_sankey/web
      - id: deployment
        uses: actions/deploy-pages@v4
